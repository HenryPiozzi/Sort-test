<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gráfico 2 — Barras agrupadas</title>
<style>
  body { font-family: Arial, sans-serif; background: #fff; color: #222; margin: 2rem; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  p  { font-size: 13px; color: #666; margin: 0 0 16px; }
  .legend { display:flex; gap:16px; font-size:12px; color:#555; margin-bottom:12px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:2px; }
</style>
</head>
<body>
<h2>Tempo médio por algoritmo e tamanho de vetor — barras agrupadas</h2>
<p>Compara os três algoritmos lado a lado para cada tamanho de entrada.</p>
<div class="legend">
  <span><span class="dot" style="background:#E24B4A"></span>Bubble Sort — O(n²)</span>
  <span><span class="dot" style="background:#1D9E75"></span>Merge Sort — O(n log n)</span>
  <span><span class="dot" style="background:#378ADD"></span>Quick Sort — O(n log n)</span>
</div>
<div style="position:relative;width:100%;height:400px;">
  <canvas id="chart" role="img" aria-label="Barras agrupadas de tempo médio por algoritmo"></canvas>
</div>
<p style="margin-top:12px;font-size:11px;color:#999;">* Bubble Sort não finalizou em 100.000 elementos (limite de 5 min). Barra omitida.</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: ['1.000', '10.000', '100.000'],
    datasets: [
      { label:'Bubble Sort', data:[0.045,9.470,null], backgroundColor:'#E24B4ACC', borderColor:'#E24B4A', borderWidth:1 },
      { label:'Merge Sort',  data:[0.002,0.030,0.379], backgroundColor:'#1D9E75CC', borderColor:'#1D9E75', borderWidth:1 },
      { label:'Quick Sort',  data:[0.001,0.021,0.278], backgroundColor:'#378ADDCC', borderColor:'#378ADD', borderWidth:1 },
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins: {
      legend:{ display:false },
      tooltip:{ callbacks:{ label: c => c.parsed.y==null ? c.dataset.label+': N/C' : c.dataset.label+': '+c.parsed.y.toFixed(3)+'s' } }
    },
    scales: {
      x:{ ticks:{autoSkip:false}, title:{display:true,text:'Tamanho do vetor (n)',font:{size:12}} },
      y:{ ticks:{callback:v=>v+'s'}, title:{display:true,text:'Tempo médio (s)',font:{size:12}} }
    }
  }
});
</script>
</body></html>
